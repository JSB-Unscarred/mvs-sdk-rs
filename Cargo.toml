[workspace]
members = ["mvs-sdk-sys"]
resolver = "3"

[package]
name = "mvs-sdk-rs"
version = "0.1.0"
edition = "2024"
description = "Safe Rust bindings for Hikvision MVS with a native Windows backend."
license = "MIT"
readme = "README.md"
repository = "https://github.com/JSB-Unscarred/mvs-sdk-rs"
homepage = "https://github.com/JSB-Unscarred/mvs-sdk-rs"
include = [
    "/src/**",
    "/tests/**",
    "/examples/**",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
]

keywords = ["mvs", "hikvision", "camera", "machine-vision", "ffi"]
categories = ["api-bindings", "hardware-support"]

[features]
# Enables the explicitly-invoked examples and tests that link the native SDK;
# the smoke test also requires a dedicated camera. It is intentionally off for
# normal builds and CI.
hardware-tests = []

[[test]]
name = "hardware_smoke"
required-features = ["hardware-tests"]

[[example]]
name = "callback"
required-features = ["hardware-tests"]

[[example]]
name = "polling"
required-features = ["hardware-tests"]

[dependencies]
mvs-sdk-sys = { path = "mvs-sdk-sys", version = "0.1.0" }
thiserror = "2"

[dev-dependencies]
# Compile-time positive and negative auto-trait assertions in public_api.rs.
static_assertions = "1.1"
