[workspace]
members = ["mvs-sdk-sys"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"
repository = "https://github.com/JSB-Unscarred/mvs-sdk-rs"

[workspace.lints.rust]
missing_docs = "deny"
missing_debug_implementations = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# 错误语义统一记录在 docs::architecture，逐函数复制 `# Errors` 只会制造模板文档。
missing_errors_doc = "allow"
must_use_candidate = "allow"
undocumented_unsafe_blocks = "deny"

[package]
name = "mvs-sdk"
description = "Unofficial safe Rust wrapper for the Hikrobot MVS industrial camera SDK (MvCameraControl)."
keywords = ["hikrobot", "hikvision", "mvs", "industrial-camera", "machine-vision"]
categories = ["api-bindings", "hardware-support"]
exclude = ["/.gitattributes", "/.gitignore", "/AGENTS.md", "/CLAUDE.md", "/tools"]
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = []

[lints]
workspace = true

[dependencies]
mvs-sdk-sys = { path = "mvs-sdk-sys", version = "0.1.0" }
thiserror = "2"
