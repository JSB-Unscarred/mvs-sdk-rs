[workspace]
members = ["mvs-sdk-sys"]
resolver = "3"

[package]
name = "mvs-sdk-rs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Safe Rust bindings for Hikvision MVS with a native Windows backend."
license = "MIT"
readme = "README.md"
repository = "https://github.com/JSB-Unscarred/mvs-sdk-rs"
homepage = "https://github.com/JSB-Unscarred/mvs-sdk-rs"
include = [
    "/src/**",
    "/tests/**",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
]

keywords = ["mvs", "hikvision", "camera", "machine-vision", "ffi"]
categories = ["api-bindings", "hardware-support"]

[features]
# Enables explicitly-invoked hardware tests that link the native SDK and use a
# dedicated camera. It is intentionally off for normal builds and CI.
hardware-tests = []

[[test]]
name = "hardware_smoke"
required-features = ["hardware-tests"]

[dependencies]
mvs-sdk-sys = { path = "mvs-sdk-sys", version = "0.1.0" }
thiserror = "2"
