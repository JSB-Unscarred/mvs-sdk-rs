[workspace]
members = ["mvs-sdk-sys"]
resolver = "3"

[package]
name = "mvs-sdk-rs"
version = "0.1.0"
edition = "2024"
description = "Safe Rust bindings for Hikvision MVS with a native Windows backend."
license = "MIT"
readme = "README.md"
repository = "https://github.com/JSB-Unscarred/mvs-sdk-rs"
homepage = "https://github.com/JSB-Unscarred/mvs-sdk-rs"

keywords = ["mvs", "hikvision", "camera", "machine-vision", "ffi"]
categories = ["api-bindings", "hardware-support"]

[lib]
name = "mvs_sdk_rs"
path = "src/lib.rs"

[features]
default = []
# Regenerate mvs-sdk-sys/src/bindings.rs from the headers in
# $MVCAM_COMMON_RUNENV/Includes.
# Requires libclang. Only needed by maintainers after SDK upgrades.
bindgen = ["mvs-sdk-sys/bindgen"]

[dependencies]
mvs-sdk-sys = { path = "mvs-sdk-sys", version = "0.1.0", default-features = false }
thiserror = "2"

[dev-dependencies]
# Compile-time positive and negative auto-trait assertions in public_api.rs.
static_assertions = "1.1"
